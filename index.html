async function flushPush(){
  if(FL){AGAIN=true;return}
  FL=true;
  setSync('syncing','☁️ 同步中…');
  try{
    const res=await fetch('/api/sync',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data:S,clientId:CLIENT_ID})
    });
    if(res.ok){
      const data=await res.json();
      lastServerVersion=data.version;
      const d=new Date(),p=n=>String(n).padStart(2,'0');
      setSync('ok',`☁️ 已同步 ${p(d.getHours())}:${p(d.getMinutes())}`);
    }else{
      setSync('err','⚠️ 本機儲存中');
    }
  }catch(e){
    setSync('err','⚠️ 離線使用(已存本機)');
  }finally{
    FL=false;
    if(AGAIN){AGAIN=false;cloudPush()}
  }
}

async function pullServerState(){
  try{
    const res=await fetch('/api/sync');
    if(!res.ok)return;
    const json=await res.json();
    if(!json.data){flushPush();return}
    if(json.version!==lastServerVersion){
      lastServerVersion=json.version;
      S=json.data;
      try{localStorage.setItem('kx27',JSON.stringify(S))}catch(e){}
      const d=new Date(),p=n=>String(n).padStart(2,'0');
      setSync('ok',`☁️ 已同步 ${p(d.getHours())}:${p(d.getMinutes())}`);
      renderSoft();
    }
  }catch(e){}
}

function initCloud(){
  pullServerState();
  try{
    if(window.EventSource){
      if(eventSource)eventSource.close();
      eventSource=new EventSource('/api/sync/events');
      eventSource.onopen=()=>{setSync('ok','☁️ 雲端即時連線中')};
      eventSource.onmessage=(e)=>{
        try{
          const msg=JSON.parse(e.data);
          if(msg.sourceClientId===CLIENT_ID)return;
          pullServerState();
        }catch(err){}
      };
      eventSource.onerror=()=>{setSync('conn','☁️ 同步重新連線…')};
    }
  }catch(e){}
  setInterval(pullServerState,3500);
  window.addEventListener('focus',pullServerState);
  window.addEventListener('online',pullServerState);
}

function getPlanDays() {

  return BASE.map((x, k) => ({ id: 'day_' + k, d: x.d, w: x.w, t: x.t }));
}

  if (!S.days || !Array.isArray(S.days)) {

function getDaySpots(dayIdx) {
  const days = getPlanDays();
  const dObj = days[dayIdx] || days[0];
  const dayId = dObj ? dObj.id : ('day_' + dayIdx);
  
  if (S.ov[dayId]) return S.ov[dayId];
  if (S.ov[dayIdx]) return S.ov[dayIdx];
  
  const m = /^day_(\d+)$/.exec(dayId);
  if (m) {
    const k = parseInt(m[1], 10);
    if (BASE[k] && BASE[k].r) {
      return BASE[k].r.map((r, i) => mk(r, i, k, 'spot_' + k + '_' + i));
    }
  }
  return [];
}

function savePlanDay(idx) {
  const t = ($('#epd_t').value || '').trim();
  const d = $('#epd_d').value;
  const w = $('#epd_w').value;
  if (!t) return alert('請輸入主題或標題');
  ensureDaysInitialized();
  const curRole = (S.mem[S.me] || S.mem[0] || {}).n || '成員';
  S.days[idx].t = t;
  S.days[idx].d = d;
  S.days[idx].w = w;
  S.days[idx].editedAt = nowStr();
  S.days[idx].editedBy = curRole;
  save();
  M('');
  render();
}

function addPlanDay() {
  const days = getPlanDays();
  const lastDay = days[days.length - 1] || { d: '2027-04-18', w: '日' };
  let nextDateStr = '2027-04-19';
  let nextW = '一';
  try {
    const nextDate = new Date(lastDay.d);
    nextDate.setDate(nextDate.getDate() + 1);
    const p = n => String(n).padStart(2, '0');
    nextDateStr = `${nextDate.getFullYear()}-${p(nextDate.getMonth() + 1)}-${p(nextDate.getDate())}`;
    const W_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
    nextW = W_NAMES[nextDate.getDay()];
  } catch(e) {}

  M(`<h2>＋ 新增天 (DAY ${days.length + 1})</h2>
    主題 / 標題
    <input id=apd_t placeholder="例如：加碼神戶市區、京都一日遊…">
    日期
    <input id=apd_d type=date value="${nextDateStr}">
    星期
    <select id=apd_w>
      ${['一','二','三','四','五','六','日'].map(w=>`<option ${w==nextW?'selected':''}>${w}</option>`).join('')}
    </select>
    <div class=row>
      <button class="btn pri" onclick="saveNewPlanDay()">建立</button>
      <button onclick="M('')">取消</button>
    </div>`);
}

function saveNewPlanDay() {
  const t = ($('#apd_t').value || '').trim();
  const d = $('#apd_d').value;
  const w = $('#apd_w').value;
  if (!t) return alert('請輸入主題或標題');
  ensureDaysInitialized();
  const curRole = (S.mem[S.me] || S.mem[0] || {}).n || '成員';
  const newDayId = 'day_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  S.days.push({
    id: newDayId,
    d: d,
    w: w,
    t: t,
    createdAt: nowStr(),
    createdBy: curRole
  });
  day = S.days.length - 1;
  save();
  M('');
  render();
}

function delPlanDay(idx) {
  const days = getPlanDays();
  if (days.length <= 1) return alert('旅程至少需要保留 1 天！');
  const dObj = days[idx];
  const spots = getDaySpots(idx).filter(s => !s.deleted);
  
  if (!confirm(`確定要刪除「DAY ${idx + 1}：${dObj.t}」整天嗎？\n\n⚠️ 注意：這將會一併移除該天所屬的所有景點 (${spots.length} 個) 與其照片、網址附件，且無法復原！`)) {
    return;
  }
  ensureDaysInitialized();
  const removedDay = S.days.splice(idx, 1)[0];
  if (removedDay && removedDay.id && S.ov[removedDay.id]) {
    delete S.ov[removedDay.id];
  }
  if (day >= S.days.length) day = S.days.length - 1;
  save();
  render();
}

function upd(L){
  const days = getPlanDays();
  const dObj = days[day] || days[0];
  const dayId = dObj ? dObj.id : ('day_' + day);
  S.ov[dayId] = L;
  save();

function mv(i,d){
  const L = structuredClone(items(day));
  let j = i + d;
  while(j >= 0 && j < L.length && L[j].deleted) j += d;
  if(j < 0 || j >= L.length) return;
  [L[i], L[j]] = [L[j], L[i]];
  upd(L);
}

// ---- 通用專用把手拖曳排序 (支援手機觸控與桌機滑鼠，不干擾頁面上下捲動)
let curDrag = null;

function startDragSort(e, type, fromIdx, extra) {
  if (e.button && e.button !== 0) return;
  e.preventDefault();
  const handleEl = e.currentTarget;
  try {
    handleEl.setPointerCapture(e.pointerId);
  } catch (err) {}

  let itemEl = handleEl.closest(`[data-drag-type="${type}"]`) || handleEl.closest('.card') || handleEl.parentElement;

  curDrag = {
    type,
    fromIdx: parseInt(fromIdx, 10),
    extra: (extra !== undefined && extra !== null) ? String(extra) : '',
    targetIdx: parseInt(fromIdx, 10),
    handleEl,
    itemEl,
    pointerId: e.pointerId
  };

  if (itemEl) {
    itemEl.classList.add('drag-active');
  }

  const onPointerMove = evt => {
    if (!curDrag || evt.pointerId !== curDrag.pointerId) return;
    evt.preventDefault();
    const y = evt.clientY;

    let selector = `[data-drag-type="${curDrag.type}"]`;
    if (curDrag.extra) {
      selector += `[data-drag-extra="${curDrag.extra}"]`;
    }
    const candidates = Array.from(document.querySelectorAll(selector));
    if (candidates.length <= 1) return;

    let closestEl = null;
    let closestDist = Infinity;

    candidates.forEach(el => {
      const rect = el.getBoundingClientRect();
      const midY = (rect.top + rect.bottom) / 2;
      const dist = Math.abs(y - midY);
      if (dist < closestDist) {
        closestDist = dist;
        closestEl = el;
      }
    });

    if (closestEl) {
      const targetIdx = parseInt(closestEl.getAttribute('data-drag-idx'), 10);
      if (!isNaN(targetIdx)) {
        curDrag.targetIdx = targetIdx;
        candidates.forEach(el => {
          if (el === closestEl && el !== curDrag.itemEl) {
            el.classList.add('drag-over');
          } else {
            el.classList.remove('drag-over');
          }
        });
      }
    }
  };

  const onPointerUp = evt => {
    if (!curDrag || evt.pointerId !== curDrag.pointerId) return;
    try {
      handleEl.releasePointerCapture(evt.pointerId);
    } catch (err) {}
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);

    let selector = `[data-drag-type="${curDrag.type}"]`;
    if (curDrag.extra) {
      selector += `[data-drag-extra="${curDrag.extra}"]`;
    }
    document.querySelectorAll(selector).forEach(el => {
      el.classList.remove('drag-active', 'drag-over');
    });

    const { type, fromIdx, targetIdx, extra } = curDrag;
    curDrag = null;

    if (fromIdx !== targetIdx && targetIdx !== undefined && !isNaN(targetIdx)) {
      executeReorder(type, fromIdx, targetIdx, extra);
    }
  };

  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}

function executeReorder(type, fromIdx, toIdx, extra) {
  if (fromIdx === toIdx) return;
  if (type === 'plan') {
    const L = structuredClone(items(day));
    if (fromIdx < 0 || fromIdx >= L.length || toIdx < 0 || toIdx >= L.length) return;
    const item = L[fromIdx];
    L.splice(fromIdx, 1);
    L.splice(toIdx, 0, item);
    upd(L);
  } else if (type === 'book') {
    if (fromIdx < 0 || fromIdx >= S.book.length || toIdx < 0 || toIdx >= S.book.length) return;
    const item = S.book[fromIdx];
    S.book.splice(fromIdx, 1);
    S.book.splice(toIdx, 0, item);
    save();
    render();
  } else if (type === 'wish') {
    if (fromIdx < 0 || fromIdx >= S.wish.length || toIdx < 0 || toIdx >= S.wish.length) return;
    const item = S.wish[fromIdx];
    S.wish.splice(fromIdx, 1);
    S.wish.splice(toIdx, 0, item);
    save();
    render();
  } else if (type === 'mem') {
    if (fromIdx < 0 || fromIdx >= S.mem.length || toIdx < 0 || toIdx >= S.mem.length) return;
    const curRoleName = (S.mem[S.me] || {}).n;
    const item = S.mem[fromIdx];
    S.mem.splice(fromIdx, 1);
    S.mem.splice(toIdx, 0, item);
    // 連動所選角色：確保所選角色不換成別人
    if (curRoleName) {
      const newMe = S.mem.findIndex(m => m.n === curRoleName);
      if (newMe >= 0) S.me = newMe;
    }
    save();
    render();
  } else if (type === 'prep_tab') {
    const tabs = structuredClone(getPrepTabs());
    if (fromIdx < 0 || fromIdx >= tabs.length || toIdx < 0 || toIdx >= tabs.length) return;
    const item = tabs[fromIdx];
    tabs.splice(fromIdx, 1);
    tabs.splice(toIdx, 0, item);
    S.pk_tabs = tabs;
    pt = toIdx;
    save();
    render();
  } else if (type === 'prep_card') {
    const tabIdx = parseInt(extra, 10);
    const tabs = structuredClone(getPrepTabs());
    const tab = tabs[tabIdx];
    if (tab && tab.cards) {
      if (fromIdx < 0 || fromIdx >= tab.cards.length || toIdx < 0 || toIdx >= tab.cards.length) return;
      const item = tab.cards[fromIdx];
      tab.cards.splice(fromIdx, 1);
      tab.cards.splice(toIdx, 0, item);
      S.pk_tabs = tabs;
      save();
      render();
    }
  } else if (type === 'prep_item') {
    const p = extra;
    const list = gl(p);
    if (fromIdx < 0 || fromIdx >= list.length || toIdx < 0 || toIdx >= list.length) return;
    const item = list[fromIdx];
    list.splice(fromIdx, 1);
    list.splice(toIdx, 0, item);
    save();
    render();
  }
}

function shrink(f,cb,w){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,w/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);store(c.toDataURL('image/jpeg',.65),cb)};im.onerror=()=>alert('圖片無法讀取');im.src=r.result};r.readAsDataURL(f)}
function upImg(el,i){const f=el.files[0];if(f)shrink(f,d=>{S.book[i].img=S.book[i].img||[];S.book[i].img.push(d);save();render()},1000)}
function upPdf(el,i){
  const f=el.files[0];
  if(!f)return;
  if(f.size > 10 * 1024 * 1024){
    alert('PDF 檔案過大，請勿超過 10MB！');
    el.value = '';
    return;
  }
  const uploaderRole = (S.mem[S.me] || S.mem[0] || {}).n || '成員';
  const uploadTime = nowStr();
  const r=new FileReader();
  r.onload=()=>{
    const d=r.result;
    fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,data:d,type:'pdf'})})
    .then(res=>res.json())
    .then(json=>{
      if(json.error) return alert(json.error);
      S.book[i].pdf=S.book[i].pdf||[];
      S.book[i].pdf.push({name:f.name,url:json.url||d,uploader:uploaderRole,uploadedAt:uploadTime});
      save();render();
    })
    .catch(()=>{
      S.book[i].pdf=S.book[i].pdf||[];
      S.book[i].pdf.push({name:f.name,url:d,uploader:uploaderRole,uploadedAt:uploadTime});
      save();render();
    });
  };
  r.readAsDataURL(f);
}

function uploadCompressedImage(file, callback) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    alert('照片檔案過大，請勿超過 10MB！');
    return;
  }
  const uploaderRole = (S.mem[S.me] || S.mem[0] || {}).n || '成員';
  const uploadTime = nowStr();
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1600;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const jpegData = canvas.toDataURL('image/jpeg', 0.8);
      
      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: file.name, data: jpegData, type: 'image' })
      })
      .then(res => res.json())
      .then(json => {
        if (json.error) return alert(json.error);
        callback({
          url: json.url,
          name: file.name,
          uploader: uploaderRole,
          uploadedAt: uploadTime
        });
      })
      .catch(() => {
        alert('照片上傳失敗，請確認網路連線');
      });
    };
    img.onerror = () => alert('圖片格式無法解碼');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

                <img src="${p.url}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--ln)" onclick="viewPhoto('${p.url}','${esc(p.name||'')}','${esc(p.uploader||'')}','${esc(p.uploadedAt||'')}','delWishPhoto(${i},${pIdx})')">
              </div>
            `).join('')}
          </div>
        ` : ''}

        <!-- 附加網址列表 -->
        ${urls.length ? `
          <div style="margin:6px 0;display:flex;flex-direction:column;gap:4px">
            ${urls.map((u, uIdx) => `
              <div style="display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);padding:4px 8px;border-radius:6px;border:1px solid var(--ln);width:fit-content;max-width:100%">
                <a href="${esc(u.url)}" target="_blank" rel="noopener" style="color:var(--g);text-decoration:underline;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  🔗 ${esc(u.title || u.url)}
                </a>
                <button class=sm style="padding:1px 5px;font-size:11px" onclick="editWishUrl(${i},${uIdx})">✏️</button>
                <button class=sm style="padding:1px 5px;font-size:11px" onclick="delWishUrl(${i},${uIdx})">🗑</button>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <!-- 操作按鈕列 -->
        <div class=row style="margin-top:8px">
          <label class="btn sm">
            📷 上傳照片 / 拍照
            <input type=file accept="image/*" hidden onchange="uploadWishPhoto(this,${i})">
          </label>
          <button class="btn sm" onclick="addWishUrl(${i})">🔗 附加網址</button>
        </div>
      </div>`;
    }).join('') || '<div class=mut>目前沒有項目</div>'}
  `;
}

function we(i){
  const x=S.wish[i];
  M(`<h2>✏️ 修改願望</h2>
    名稱<input id=e1 value="${esc(x.t)}">
    備註<input id=e2 value="${esc(x.n||'')}">
    <div class=row>
      <button class="btn pri" onclick="if($('#e1').value.trim()){S.wish[${i}].t=$('#e1').value.trim();S.wish[${i}].n=$('#e2').value;save();M('');render()}">儲存</button>
      <button onclick="M('')">取消</button>
    </div>`);
}

// ---- 成員 (支援專用把手拖曳排序、上移/下移，排序時連動目前使用者確保角色不跑掉)
function mem(){
  return hdr()+`<h2>👥 成員</h2>${S.mem.map((m,i)=>{
    const isFirst = i === 0;
    const isLast = i === S.mem.length - 1;
    const isCur = i === S.me;
    return `<div class="card ${isCur?'sel':''}" data-drag-type="mem" data-drag-idx="${i}" style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px">
        <span class=dh onpointerdown="startDragSort(event, 'mem', ${i})" title="按住拖曳排序">⠿ 拖曳</span>
        <div>${m.e} <b>${esc(m.n)}</b> <span class=tag>${esc(m.r)}</span>${m.a?`<span class=tag>${esc(m.a)}</span>`:''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        ${!isFirst ? `<button class=sm onclick="mvMem(${i},-1)" title="上移">↑ 上移</button>` : `<button class=sm disabled style="opacity:.35;cursor:not-allowed">↑ 上移</button>`}
        ${!isLast ? `<button class=sm onclick="mvMem(${i},1)" title="下移">↓ 下移</button>` : `<button class=sm disabled style="opacity:.35;cursor:not-allowed">↓ 下移</button>`}
        <button class="sm ${isCur?'on':''}" onclick="S.me=${i};save();render()">${isCur?'★ 目前使用者':'設為使用者'}</button>
        <button class="sm dg" onclick="if(confirm('確定刪除成員「${esc(m.n)}」嗎？')){S.mem.splice(${i},1);if(S.me>=S.mem.length)S.me=0;save();render()}">🗑</button>
      </div>
    </div>`;
  }).join('')}<div class=card><b>新增成員</b><div class=g2><input id=m1 placeholder="暱稱"><input id=m2 placeholder="表情 👦"></div><div class=g2><select id=m3><option>大人</option><option>小孩</option></select><input id=m4 placeholder="年齡/身高(待填)"></div><button class="btn pri" onclick="if($('#m1').value){S.mem.push({n:$('#m1').value,e:$('#m2').value||'🙂',r:$('#m3').value,a:$('#m4').value});save();render()}">新增</button></div><div class=warn>資料會即時儲存在本機瀏覽器中。「目前使用者」「PIN」只存在各自的裝置。</div>`}

function render(){if(S.pin&&!window._ok){$('#app').innerHTML='';$('#nav').innerHTML='';$('#m').innerHTML=`<div class=lock><h2>🔒 請輸入 PIN</h2><input id=pi inputmode=numeric maxlength=4 style="width:140px;text-align:center" onkeyup="if(this.value==S.pin){window._ok=1;$('#m').innerHTML='';render()}"></div>`;return}
$('#app').innerHTML=({plan,map:mapv,book,acc,jr,prep,wish,mem})[tab]();
$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}${t[0]=='prep'&&left()?`<span class=bd>${left()}</span>`:''}</button>`).join('')}

// 掛載至 window 確保 inline onclick/onchange 正常執行
Object.assign(window, {$, esc, plan, mapv, book, acc, jr, prep, wish, mem, go, M, sd, edit, tg, mv, del, undel, purge, resetDay, addPh, sv, rtog, rall, qadd, cadd, bk, bs, upImg, upPdf, addB, ebImg, ebPdf, rpt, we, syInfo, pinUi, expUi, ttl, gl, render, save, editJr, saveJrEdit, showJrHistory, dlHtml, editPrepItem, savePrepItem, delPrepItem, addPrepItem, tgBook, uploadCompressedImage, uploadWishPhoto, viewPhoto, delWishPhoto, addWishUrl, saveWishUrl, editWishUrl, delWishUrl, tgWish, addWishItem, uploadSpotPhoto, delSpotPhoto, addSpotUrl, saveSpotUrl, editSpotUrl, delSpotUrl, editPlanDay, savePlanDay, addPlanDay, saveNewPlanDay, delPlanDay, getPlanDays, getDaySpots, items, getPrepTabs, addPrepTab, saveNewPrepTab, editPrepTab, saveEditPrepTab, delPrepTab, addPrepCard, saveNewPrepCard, editPrepCard, saveEditPrepCard, delPrepCard, startDragSort, executeReorder, mvBook, mvWish, mvMem, mvPrepTab, mvPrepCard, mvPrepItem});

render();
initCloud();
</script></body></html>
